# Hermes project registry
#
# The source of truth for which Claude Code projects Hermes may operate, where
# they live inside the container, and with what scope. Version-controlled and
# mounted READ-ONLY into the container at /opt/registry/projects.yaml. The
# operator resolves a project NAME → workdir + scope from here.
#
# SCOPE (enforced by the operator policy, see skills/claude-code-operator):
#   read   -> `claude -p` runs read-only: --permission-mode plan and
#             --allowedTools 'Read,Grep,Glob'. This is all P2 allows.
#   write  -> DEFERRED to plan P5 (writable mount + approval guardrails). Not yet
#             permitted; the operator must refuse write-scope requests for now.
#
# MODELS: `claude -p` (the executor) stays direct on Anthropic. default_model is
# the cheap tier for routine read/summary/inventory work; the operator may step
# up to a stronger tier for genuinely hard analysis (see the operator policy).
version: 1

projects:
  claude_code:
    workdir: /projects/claude_code
    scope: read
    default_model: claude-haiku-4-5
    description: >
      Skill & Agent Pipeline Toolkit — THIS repo. Sources, vets, adapts,
      measures, and auto-improves Claude Code skills and agents. Mounted
      read-only at /projects/claude_code.
    # Draft-PR delivery target (Increment 2). The mount stays scope: read — the
    # write path never touches the mount; it operates on a fresh clone of this
    # repo via the bot PAT. {repo, base, path} is structured so client repos
    # (e.g. a different base/path) need no schema migration.
    pr_target:
      repo: DentalEdge-Solutions/claude_code
      base: main
      path: .project-brain/decisions/candidates

  claude_google_ads:
    workdir: /projects/claude_google_ads
    scope: read-execute            # NEW tier: run allow-listed reader scripts only (Inc 3)
    default_model: claude-haiku-4-5
    description: >
      Google Ads API integration for the DentalEdge Solutions MCC (Python,
      google-ads SDK). read-execute: Hermes may run ALLOW-LISTED reporting
      scripts under a READ-ONLY credential; mutation is refused server-side.
      Credentials are injected per-invocation (never mounted, never in the
      gateway env). READERS ONLY — mutators are absent from the allow-list.
    read_execute:
      runner: /opt/ads-venv/bin/python3   # pinned build-time venv (Task 1), NOT base python
      script_dir: code             # relative to workdir
      allow:                       # EXACT basenames; fail-closed; READERS ONLY
        - test_connection          # Inc-3 connectivity smoke (kept; not in the audit bundle)
        - account_overview
        - audit_search_terms
        - audit_analyze

# Hermes project registry
#
# The source of truth for which Claude Code projects Hermes may operate, where
# they live inside the container, and with what scope. Version-controlled and
# mounted READ-ONLY into the container at /opt/registry/projects.yaml. The
# operator resolves a project NAME → workdir + scope from here.
#
# SCOPE (enforced by the operator policy, see skills/claude-code-operator):
#   read   -> `claude -p` runs read-only: --permission-mode plan and
#             --allowedTools 'Read,Grep,Glob'. This is all P2 allows.
#   write  -> DEFERRED to plan P5 (writable mount + approval guardrails). Not yet
#             permitted; the operator must refuse write-scope requests for now.
#
# MODELS: `claude -p` (the executor) stays direct on Anthropic. default_model is
# the cheap tier for routine read/summary/inventory work; the operator may step
# up to a stronger tier for genuinely hard analysis (see the operator policy).
version: 1

projects:
  claude_code:
    workdir: /projects/claude_code
    scope: read
    default_model: claude-haiku-4-5
    description: >
      Skill & Agent Pipeline Toolkit — THIS repo. Sources, vets, adapts,
      measures, and auto-improves Claude Code skills and agents. Mounted
      read-only at /projects/claude_code.
    # Paths (workdir-relative) masked out of the container view. The whole directory
    # is masked rather than each .env.* individually, so a newly minted credential file
    # cannot silently reappear in the container.
    mask_paths:
      - infra/hermes-agent
    # Draft-PR delivery target (Increment 2). The mount stays scope: read — the
    # write path never touches the mount; it operates on a fresh clone of this
    # repo via the bot PAT. {repo, base, path} is structured so client repos
    # (e.g. a different base/path) need no schema migration.
    pr_target:
      repo: DentalEdge-Solutions/claude_code
      base: main
      path: .project-brain/decisions/candidates

  claude_google_ads:
    workdir: /projects/claude_google_ads
    scope: read-execute            # NEW tier: run allow-listed reader scripts only (Inc 3)
    # A single secret-bearing file: masked with an empty bind rather than a tmpfs, so
    # the file still EXISTS and load_dotenv() reads nothing instead of erroring.
    mask_paths:
      - .env
    default_model: claude-haiku-4-5
    description: >
      Google Ads API integration for the DentalEdge Solutions MCC (Python,
      google-ads SDK). read-execute: Hermes may run ALLOW-LISTED reporting
      scripts under a READ-ONLY credential; mutation is refused server-side.
      Credentials are injected per-invocation (never mounted, never in the
      gateway env). READERS ONLY — mutators are absent from the allow-list.
    read_execute:
      runner: /opt/ads-venv/bin/python3   # pinned build-time venv (Task 1), NOT base python
      script_dir: code             # relative to workdir
      allow:                       # EXACT basenames; fail-closed; READERS ONLY
        - test_connection          # Inc-3 connectivity smoke (kept; not in the audit bundle)
        - account_overview
        - audit_search_terms
        - audit_analyze
        # --- opened 2026-08-17: analysis readers, verified non-mutating and
        # verified runnable in-container. A read-only credential already bounds
        # the worst case to "produces a bad report", so withholding these bought
        # no safety. Each was probed live before being listed here.
        - find_negatives           # pure local compute over audit_data/ (no credential)
        - simulate_negatives       # pure local compute over audit_data/ (no credential)
        - rsa_rubric_check         # pure local compute over audit_data/ (no credential)
        - discover_accounts        # API reader, no file writes
        - negatives_coverage       # pure local compute; spec-parser fixed 2026-08-18
        #
        # DELIBERATELY NOT LISTED — each verified, each for a different reason:
        #
        #   audit_assets_rsa / assess_supplemental / build_dashboard_data
        #     Non-mutating, but they WRITE into the project tree
        #     (<workdir>/audit_data/, <workdir>/landing/data/). Hermes mounts
        #     projects :ro, so in-container they die with
        #     `OSError: [Errno 30] Read-only file system` at the first write —
        #     AFTER spending real API calls. These belong host-side, alongside
        #     collect-audit-data.sh, which exists precisely because refreshing
        #     audit_data/ requires writing the project tree.
        #
        #   add_campaign_negative / add_competitor_negatives / apply_negatives /
        #   attach_audience — mutators. NEVER allow-listed, in this project or
        #   any future one. Guarded at the script via code/injected_credentials.py.
    # MUTATION TIER (Task 2 increment). Separate from read_execute by design: the
    # read allow-list's invariant is "readers only; mutators are never allow-listed",
    # and apply-changeset.py refuses if any name appears in BOTH lists.
    # Runs under a SEPARATE Standard-access write credential (.env.gaw), injected
    # per-invocation. Never the read-only .env.ga, never the gateway env.
    mutate_execute:
      runner: /opt/ads-venv/bin/python3   # pinned build-time venv, NOT base python
      script_dir: code             # relative to workdir
      allow:                       # EXACT basenames; fail-closed; ONE typed mutator
        - mutate_campaign_negative
      caps:                        # fail-closed: missing or malformed => refuse
        actions_per_changeset: 25      # largest batch a human can review in one sitting
        actions_per_client_day: 100
        applies_per_client_day: 5      # load-bearing cap against malfunction
        approval_ttl_hours: 24
        # --- spool quotas (Plan 2). Read by the BROKER, not the executor. Refused
        # requests never consume applies_per_client_day, so without these nothing
        # bounds how many requests Hermes can file: unbounded log noise and a
        # denial of service on a single-threaded broker.
        max_pending_requests: 8            # unprocessed requests allowed to queue per client
        accepted_requests_per_client_day: 20   # accepted (not merely filed) per client per UTC day
